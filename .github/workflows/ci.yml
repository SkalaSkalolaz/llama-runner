name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — нужен, чтобы git describe --tags увидел теги релизов.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # Формат — первое, что падает: дешёвая проверка до сборки и тестов.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Эти файлы не отформатированы (gofmt -w .):"
            echo "$unformatted"
            exit 1
          fi

      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out

      # Версия внедряется через ldflags; дефолт в main.go остаётся для локальных сборок.
      - name: build with version
        run: |
          VERSION="$(git describe --tags --always --dirty)"
          go build -ldflags "-X main.version=$VERSION" -o llama-runner ./cmd/llama-runner
          echo "llama-runner -version -> $(./llama-runner -version)"
